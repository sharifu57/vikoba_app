name: vikoba_app
description: "Vikoba 360 group finance and community management."


publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.0
  intl: 0.20.3
  dio: ^5.5.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  form_field_validator: ^1.1.0
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.8
  flutter_splash_screen: ^4.0.0
  flutter_spinkit: ^5.2.2
  flutter_launcher_icons: ^0.14.4
  easy_localization: ^3.0.8
  flutter_styled_toast: ^2.3.0
  smooth_page_indicator: ^3.0.0
  pin_code_fields: ^9.4.0
  flutter_advanced_drawer: ^1.5.0
  fl_chart: ^1.2.0
  mobile_scanner: ^7.4.0
  background_fetch: ^1.7.0
  hive_flutter: ^1.1.0
  dio_cache_interceptor: ^4.0.7
  hive: ^2.2.3
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3



# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/fonts/
    - .env
    # - assets/icons/medical_icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
