<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Medical Cyan/Teal Gradient for Left/Main Structure -->
    <linearGradient id="cyanGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>

    <!-- Vibrant Red/Orange Gradient for the Right 'Core' Element -->
    <linearGradient id="coreGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>

    <!-- Subtle Glow Filter for the Futuristic Effect -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Transparent Background / Only the Bold, Italic M Mark -->
  <g filter="url(#cleanGlow)" transform="translate(-50, 15)">
    <!-- Left Pillar + First Down-Swoosh -->
    <path d="M 200,280 L 240,80 Q 250,40 280,40 L 320,40 L 290,190 L 250,190 Z" fill="url(#cyanGradIcon)" />
    
    <!-- Central Core Connection (The Sharp V-Turn) -->
    <path d="M 285,215 L 335,40 L 385,40 L 320,280 Z" fill="url(#cyanGradIcon)" opacity="0.9" />
    
    <!-- Right Dynamic Swoosh (Futuristic Speed/Core Trail) -->
    <path d="M 305,245 L 360,40 Q 375,0 410,0 L 450,0 L 395,280 L 350,280 Z" fill="url(#coreGradIcon)" />
    
    <!-- Medical Cross Element Embedded inside the Mark -->
    <path d="M 385,90 L 415,90 M 400,75 L 400,105" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95" />
  </g>
</svg>


