<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MediCore M logo">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5FFF"/>
      <stop offset="50%" stop-color="#1EA5FF"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Letter gradient -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E6F4FF"/>
      <stop offset="100%" stop-color="#C3EAF8"/>
    </linearGradient>

    <!-- Soft inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Shadow under the M -->
    <filter id="mShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>

  <!-- Rounded background with gradient -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56"
        fill="url(#bgGradient)" />

  <!-- Inner glow for ufutio-style softness -->
  <ellipse cx="128" cy="88" rx="110" ry="80"
           fill="url(#innerGlow)" />

  <!-- Bold italic M -->
  <g filter="url(#mShadow)">
    <text x="50%" y="58%"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="url(#mGradient)"
          font-size="150"
          font-weight="900"
          font-style="italic"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      M
    </text>
  </g>

  <!-- Subtle highlight stroke around M -->
  <g>
    <text x="50%" y="58%"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="none"
          stroke="rgba(255,255,255,0.25)"
          stroke-width="3"
          font-size="150"
          font-weight="900"
          font-style="italic"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      M
    </text>
  </g>
</svg>