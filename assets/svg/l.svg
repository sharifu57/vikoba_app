<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>

    <!-- Medical Cyan/Teal Gradient for Left/Main Pillar -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>

    <!-- Vibrant Red/Orange Gradient for the Right 'Pulse/Core' Swoosh -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>

    <!-- Soft Glow Filter for that "Ufutio/Cool" effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Tech Background (Optional but makes the colors pop) -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <g transform="translate(20, 10)">
    <!-- ================= LOGO ICON ================= -->
    <!-- The Bold, Italicized, Dynamic 'M' with a medical pulse/cross vibe -->
    <g filter="url(#glow)">
      <!-- Left Pillar + First Down-Swoosh -->
      <path d="M 280,380 L 320,180 Q 330,140 360,140 L 400,140 L 370,290 L 330,290 Z" fill="url(#cyanGrad)" />
      
      <!-- Central Core Connection (The Sharp V-Turn) -->
      <path d="M 365,315 L 415,140 L 465,140 L 400,380 Z" fill="url(#cyanGrad)" opacity="0.9" />
      
      <!-- Right Dynamic Swoosh (The Vitality/Core element with the "ufutio" speed trail) -->
      <path d="M 385,345 L 440,140 Q 455,100 490,100 L 530,100 L 475,380 L 430,380 Z" fill="url(#coreGrad)" />
      
      <!-- Medical Cross / Spark Accent embedded in the heart of the M -->
      <path d="M 465,190 L 495,190 M 480,175 L 480,205" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95" />
    </g>

    <!-- ================= TYPOGRAPHY ================= -->
    <!-- "MEDI" - Bold, Modern, Clean Italic -->
    <text x="400" y="480" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="52" 
          font-weight="800" 
          font-style="italic" 
          fill="#FFFFFF" 
          letter-spacing="2" 
          text-anchor="end">
      MEDI
    </text>

    <!-- "CORE" - High Contrast Vibrant Red Italic -->
    <text x="405" y="480" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="52" 
          font-weight="800" 
          font-style="italic" 
          fill="url(#coreGrad)" 
          letter-spacing="2" 
          text-anchor="start">
      CORE
    </text>

    <!-- Minimalist Tagline -->
    <text x="400" y="515" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="14" 
          font-weight="600" 
          fill="#6FB1FC" 
          letter-spacing="8" 
          text-anchor="middle" 
          opacity="0.7">
      HEALTHCARE SOLUTIONS
    </text>
  </g>
</svg>
